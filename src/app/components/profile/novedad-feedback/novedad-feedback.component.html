<div class="feedback" *ngIf="tieneFeedback">
  <div class="acciones">
    <ion-button size="small" fill="clear" [color]="novedad.MiVoto === 1 ? 'primary' : 'medium'"
      [class.mi-voto]="novedad.MiVoto === 1" (click)="votar(1)" aria-label="Me gusta">
      👍 {{ novedad.VotosPositivos || 0 }}
    </ion-button>
    <ion-button size="small" fill="clear" [color]="novedad.MiVoto === -1 ? 'primary' : 'medium'"
      [class.mi-voto]="novedad.MiVoto === -1" (click)="votar(-1)" aria-label="No me gusta">
      👎 {{ novedad.VotosNegativos || 0 }}
    </ion-button>
    <ion-button size="small" fill="clear" color="medium" (click)="abrirOCerrarComentarios()">
      💬 Comentarios ({{ novedad.NumeroComentarios || 0 }})
    </ion-button>
  </div>

  <div class="comentarios" *ngIf="comentariosAbiertos">
    <ion-spinner *ngIf="cargandoComentarios" name="crescent"></ion-spinner>

    <div class="comentario" *ngFor="let comentario of comentarios">
      <div class="cabecera">
        <strong>{{ comentario.NombreVisible }}</strong> · {{ comentario.Fecha | date:'dd/MM/yyyy HH:mm' }}
        <ion-button *ngIf="comentario.EsMio" size="small" fill="clear" color="danger" (click)="borrarComentario(comentario)">Borrar</ion-button>
      </div>
      <div class="texto">{{ comentario.Texto }}</div>
      <img *ngIf="imagenes[comentario.Id]" class="miniatura" [src]="imagenes[comentario.Id]" (click)="ampliarImagen(comentario.Id)" alt="Captura adjunta" />
    </div>

    <ion-item lines="none" class="nuevo-comentario">
      <ion-textarea [(ngModel)]="nuevoTexto" [autoGrow]="true" [maxlength]="2000" aria-label="Tu comentario"
        placeholder="Escribe tu comentario…" (paste)="captura.alPegar($event)"></ion-textarea>
    </ion-item>

    <captura-adjunta #captura [(imagen)]="imagenAdjunta">
      <ion-button size="small" [disabled]="!puedeEnviar" (click)="enviarComentario()">Enviar</ion-button>
    </captura-adjunta>
  </div>
</div>
