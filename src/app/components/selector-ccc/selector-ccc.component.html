<ion-item *ngIf="cargando">
  <ion-label>Cuenta del recibo</ion-label>
  <ion-spinner slot="end" name="crescent"></ion-spinner>
</ion-item>
<ion-item *ngIf="!cargando && cccsValidos.length === 1">
  <ion-label>Cuenta del recibo</ion-label>
  <ion-note slot="end">{{ descripcion(cccsValidos[0]) }}</ion-note>
</ion-item>
<ion-item *ngIf="!cargando && cccsValidos.length > 1">
  <ion-label>Cuenta del recibo</ion-label>
  <ion-select slot="end" aria-label="Cuenta del recibo" interface="action-sheet" [cancelText]="'Cancelar'"
    [value]="numeroSeleccionado" (ionChange)="seleccionarCCC($event.detail.value)">
    <ion-select-option *ngFor="let ccc of cccsValidos" [value]="ccc.numero.trim()">{{ descripcion(ccc) }}</ion-select-option>
  </ion-select>
</ion-item>
<ion-item *ngIf="sinCCCValido" color="warning" lines="none">
  <ion-label class="ion-text-wrap">
    <strong>Este cliente no tiene cuenta bancaria válida: el recibo NO se podrá mandar al banco.</strong>
    Pide la cuenta o elige otra forma de pago.
  </ion-label>
</ion-item>
<ion-item *ngIf="errorCarga" color="warning" lines="none">
  <ion-label class="ion-text-wrap">No se ha podido comprobar la cuenta bancaria del cliente.</ion-label>
</ion-item>
