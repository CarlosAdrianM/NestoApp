<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>NIF incorrectos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cargar()">
        <ion-icon name="refresh"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="cargar($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>

  <div *ngIf="!cargando && datos.length === 0" class="ion-text-center ion-padding">
    <ion-icon name="checkmark-circle-outline" color="success" size="large"></ion-icon>
    <p>No hay clientes con NIF incorrecto.</p>
  </div>

  <ion-list>
    <ion-item *ngFor="let item of datos" (click)="corregir(item)" button detail="false">
      <ion-label class="ion-text-wrap">
        <h2>
          {{ item.nombre }}
          <ion-badge *ngIf="item.tienePedidoPendiente" color="danger">Pedido pendiente</ion-badge>
        </h2>
        <p>Cliente {{ item.cliente?.trim() }} · NIF: {{ item.nif?.trim() }}</p>
        <p *ngIf="item.resultadoAeat" class="motivo">{{ item.resultadoAeat }}</p>
        <p *ngIf="fechaMostrable(item.fechaValidacion) as fecha" class="fecha">Detectado: {{ fecha }}</p>
      </ion-label>
      <ion-icon name="create-outline" slot="end" color="primary"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
